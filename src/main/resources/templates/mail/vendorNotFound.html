<!DOCTYPE HTML>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Hata Sayfası</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #1e40af;
      --secondary-color: #3b82f6;
      --accent-color: #f59e0b;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-light: #f8fafc;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      position: relative;
    }

    /* Background Pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .navbar {
      padding: 1rem 0;
    }

    .navbar-brand img {
      height: 40px;
      transition: transform 0.3s ease;
    }

    .navbar-brand img:hover {
      transform: scale(1.05);
    }

    /* Main Content */
    .main-container {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
    }

    .error-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      margin: 0 1rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .error-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent-color), #f97316);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: var(--shadow-md);
    }

    .error-icon i {
      font-size: 2rem;
      color: white;
    }

    .error-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .order-info {
      background: var(--bg-light);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 2rem 0;
      border: 1px solid var(--border-color);
    }

    .order-number {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    /* Table Styling */
    .info-table {
      width: 100%;
      margin-top: 1rem;
    }

    .info-table th {
      background: var(--primary-color);
      color: white;
      padding: 0.75rem;
      font-weight: 500;
      text-align: left;
      border-radius: 8px 8px 0 0;
    }

    .info-table td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      background: white;
    }

    .info-table tr:last-child td {
      border-bottom: none;
      border-radius: 0 0 8px 8px;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      color: white;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
    }

    .btn-outline:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-card {
      animation: fadeInUp 0.6s ease-out;
    }

    .error-icon {
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .error-card {
        padding: 2rem 1.5rem;
        margin: 0 1rem;
      }

      .error-title {
        font-size: 1.5rem;
      }

      .error-message {
        font-size: 1rem;
      }

      .action-buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .info-table th,
      .info-table td {
        padding: 0.5rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .navbar-brand img {
        height: 32px;
      }

      .error-card {
        padding: 1.5rem 1rem;
      }

      .error-icon {
        width: 60px;
        height: 60px;
      }

      .error-icon i {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<!-- Header -->
<header class="header">
  <div class="container">
    <nav class="navbar">
      <div class="navbar-brand">
        <img th:if="${!#strings.isEmpty(logoUrl)}" th:src="${logoUrl}" alt="WMS Logo">
      </div>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main class="main-container">
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>

    <h1 class="error-title">Sipariş Bilgisi Bulunamadı</h1>

    <p class="error-message">
      Sipariş numaralı alt cari maili bulunamadı. Lütfen bilgilerinizi kontrol ediniz.
    </p>

    <div class="order-info">
      <div class="order-number">
        <i class="fas fa-receipt"></i>
        Sipariş No: <span th:text="${wms[orderNo]}">-</span>
      </div>

      <table class="info-table">
        <thead>
        <tr>
          <th><i class="fas fa-user"></i> Cari Adı</th>
          <th><i class="fas fa-user-tag"></i> Alt Cari Adı</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td th:text="${wms[cariName]}">Cari Adı</td>
          <td th:text="${wms[altCariName]}">Alt Cari Adı</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
