<!DOCTYPE HTML>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>WMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <style>
    *{
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
    }
    body{
      font-family: Helvetica;
      -webkit-font-smoothing: antialiased;
      background: rgba( 71, 147, 227, 1);
    }
    h2{
      text-align: center;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #080808;
      background-color: #f0ad4e;
      padding: 30px 10px;
      opacity: 0.75;
    }

    h3{
      text-align: center;
      font-size: 14px;
      font-weight: bolder;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #080808;
      padding: 30px 10px;
      opacity: 0.75;
    }

    /* Table Styles */

    .table-wrapper{
      margin: 10px 70px 70px;
      box-shadow: 0px 35px 50px rgba( 0, 0, 0, 0.2 );
      overflow: auto;
    }

    .fl-table {
      border-radius: 5px;
      font-size: 12px;
      font-weight: normal;
      border: none;
      border-collapse: collapse;
      width: 100%;
      max-width: 100%;
      white-space: nowrap;
      background-color: white;
    }

    .fl-table td, .fl-table th {
      text-align: center;
      padding: 8px;
    }

    .fl-table td {
      border-right: 1px solid #f8f8f8;
      font-size: 12px;
    }

    .fl-table thead th {
      color: #ffffff;
      background: #4FC3A1;
    }


    .fl-table thead th:nth-child(odd) {
      color: #ffffff;
      background: #324960;
    }

    .fl-table tr:nth-child(even) {
      background: #F8F8F8;
    }

    /* Responsive */

    @media (max-width: 767px) {
      .fl-table {
        display: block;
        width: 100%;
      }
      .table-wrapper:before{
        content: "Scroll horizontally >";
        display: block;
        text-align: right;
        font-size: 11px;
        color: white;
        padding: 0 0 10px;
      }
      .fl-table thead, .fl-table tbody, .fl-table thead th {
        display: block;
      }
      .fl-table thead th:last-child{
        border-bottom: none;
      }
      .fl-table thead {
        float: left;
      }
      .fl-table tbody {
        width: auto;
        position: relative;
        overflow-x: auto;
      }
      .fl-table td, .fl-table th {
        padding: 20px .625em .625em .625em;
        height: 60px;
        vertical-align: middle;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        width: 120px;
        font-size: 13px;
        text-overflow: ellipsis;
      }
      .fl-table thead th {
        text-align: left;
        border-bottom: 1px solid #f7f7f9;
      }
      .fl-table tbody tr {
        display: table-cell;
      }
      .fl-table tbody tr:nth-child(odd) {
        background: none;
      }
      .fl-table tr:nth-child(even) {
        background: transparent;
      }
      .fl-table tr td:nth-child(odd) {
        background: #F8F8F8;
        border-right: 1px solid #E6E4E4;
      }
      .fl-table tr td:nth-child(even) {
        border-right: 1px solid #E6E4E4;
      }
      .fl-table tbody td {
        display: block;
        text-align: center;
      }
    }
  </style>
</head>
<body>
<h2>GÜNLÜK HAREKETLER</h2>
<h3>FİRMADAN ÜRÜN KABUL</h3>
<div class="table-wrapper">
  <table class="fl-table">
    <thead>
    <tr >
      <th>Sıra No</th>
      <th>Cari Adı</th>
      <th>Sipariş No</th>
      <th>Adet</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="wms,rowStat : ${wms.receivingOrderList}" >
      <td th:text="${rowStat.index + 1}">Sıra No</td>
      <td th:text="${wms.firmName}">Kayıt Numarası</td>
      <td th:text="${wms.erpOrderInfo}">Siparis Numarasi</td>
      <td th:text="${wms.miktar}">Cari Kodu</td>
    </tr>
    <tbody>
  </table>
</div>

<h3>SEVKİYAT</h3>
<div class="table-wrapper">
  <table class="fl-table">
    <thead>
    <tr >
      <th>Sıra No</th>
      <th>Cari Adı</th>
      <th>Alt Cari Adı</th>
      <th>Sipariş No</th>
      <th>Adet</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="wms,rowStat : ${wms.dispatchOrderList}" >
      <td th:text="${rowStat.index + 1}">Sıra No</td>
      <td th:text="${wms.firmName}">Cari Adı</td>
      <td th:text="${wms.altCariAdi}">Alt Cari Adı</td>
      <td th:text="${wms.erpOrderInfo}">Erp OrderNo</td>
      <td th:text="${wms.miktar}">Toplam Hareket Miktarı</td>
    </tr>
    <tbody>
  </table>
</div>

</body>
</html>
