# ===================================================================
# Entegrasyon testleri (*IT) icin yapilandirma.
#
# Veritabani baglantisi AbstractIntegrationTest icindeki Testcontainers
# PostgreSQL'inden @DynamicPropertySource ile gelir. Dis servisler (websocket,
# minio, mail, metabase) testlerde kullanilmaz; acilista zorunlu olan
# placeholder'lar icin zararsiz degerler verilir.
# ===================================================================

logging:
  level:
    ROOT: WARN
    com.hisarresearch.wms: INFO

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: Hikari
      auto-commit: false
  jpa:
    database-platform: tech.jhipster.domain.util.FixedPostgreSQL10Dialect
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: true
  liquibase:
    contexts: test
  mail:
    host: localhost
    port: 1025
  task:
    scheduling:
      pool:
        size: 1

server:
  port: 0

jhipster:
  security:
    authentication:
      jwt:
        base64-secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3RzLW11c3QtYmUtbG9uZy1lbm91Z2gtNTEyLWJpdHM=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

pdf:
  directory: ${java.io.tmpdir}/wms-test-pdf/

metabase:
  url: http://localhost:3000
  secretKey: test-secret
  dashboardCode: 1

websocket:
  uri: ws://localhost:1/websocket

minio:
  url: http://localhost:1
  accessKey: test
  secretKey: test-secret
  bucketName: ''

sentry:
  dsn: ''
