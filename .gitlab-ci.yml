stages:
  - build
  - package
  - test
  - deploy

variables:
  IMAGE_NAME: "$DOCKER_HUB_USERNAME/wms"
  IMAGE_TAG: latest
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build_image:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  services:
    - name: docker:24.0.6-dind  # Docker-in-Docker service to build Docker images
  tags:
    - 'docker'
  before_script:
    - apt-get update && apt-get install -y docker.io
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_PASSWORD"
  script:
    - mvn clean package -DskipTests
    - export PACKAGE_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout | sed 's/-SNAPSHOT$//')
    - export LATEST_VERSION="${PACKAGE_VERSION}-${CI_PIPELINE_ID}"
    - echo "LATEST_VERSION=$LATEST_VERSION" > build.env
    - docker build -t "$IMAGE_NAME:$LATEST_VERSION" .
    - docker push "$IMAGE_NAME:$LATEST_VERSION"
  artifacts:
    reports:
      dotenv: build.env
  only:
    - master

# Test stage: Runs the unit tests for the project
test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  tags:
    - 'k10t'
  script:
    - mvn test

# Deploy stage: Deploys to Kubernetes
deploy_test:
  stage: deploy
  image: bitnamilegacy/kubectl
  tags:
    - 'k10t'
  environment:
    name: test
  script:
    # LATEST_VERSION, build_image isinin dotenv artefaktindan gelir
    - kubectl --kubeconfig=$KUBE_CONFIG set image deployment/api-1 api=$IMAGE_NAME:$LATEST_VERSION -n wms --insecure-skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
